<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ultimate Tic-Tac-Toe (Super TTT) | Gyan Games Studio</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        md: {
                            primary: '#4F46E5',
                            onPrimary: '#FFFFFF',
                            primaryContainer: '#EEF2FF',
                            onPrimaryContainer: '#1E1B4B',
                            surface: '#F8FAFC',
                            surfaceHighest: '#E2E8F0',
                            outlineVariant: '#CBD5E1',
                            secondary: '#64748B'
                        }
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Material Symbols -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- PeerJS & QRCode & Confetti -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        .active-board {
            background-color: #EEF2FF;
            box-shadow: 0 0 0 3px #6366F1;
        }

        .cell-hover:hover:not(.cell-taken) {
            background-color: #E0E7FF;
        }

        @keyframes winScale {
            0% { transform: scale(0.4); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .sub-board-conquered {
            animation: winScale 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
    </style>
</head>
<body class="bg-[#F1F5F9] text-slate-800 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- Header -->
    <header class="w-full px-4 py-3 bg-white/85 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30">
        <div class="max-w-5xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5">
                <a href="index.html" class="w-9 h-9 rounded-full bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-600 flex items-center justify-center transition-all shadow-sm" title="Back to Game Hub">
                    <span class="material-symbols-rounded text-lg">arrow_back</span>
                </a>
                <div class="w-9 h-9 rounded-2xl bg-indigo-600 text-white flex items-center justify-center shadow-md font-extrabold text-base">
                    🧠
                </div>
                <div>
                    <h1 class="font-extrabold text-sm sm:text-base tracking-tight text-slate-900">Ultimate Tic-Tac-Toe</h1>
                    <div class="text-[10px] text-slate-400 flex items-center gap-2">
                        <span id="net-indicator" class="flex items-center gap-1">
                            <span class="w-2 h-2 rounded-full bg-slate-400" id="net-dot"></span>
                            <span id="net-label">Solo / Bot</span>
                        </span>
                        <span id="hud-room-code" class="hidden font-mono font-bold bg-slate-200 text-slate-800 px-1.5 rounded cursor-pointer" title="Click to copy Room Link">ROOM: ----</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-1.5">
                <button id="btn-open-multiplayer" class="px-3.5 py-1.5 rounded-full bg-indigo-600 text-white text-xs font-bold hover:bg-indigo-700 transition-all flex items-center gap-1 shadow-sm">
                    <span class="material-symbols-rounded text-base">wifi</span>
                    <span class="hidden sm:inline">Online Room</span>
                </button>
                <button id="btn-restart" class="p-2 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all" title="Restart Board">
                    <span class="material-symbols-rounded text-base">refresh</span>
                </button>
                <button id="btn-toggle-sound" class="p-2 rounded-full bg-slate-100 text-slate-600 hover:bg-slate-200 transition-all" title="Toggle Sound">
                    <span class="material-symbols-rounded text-base" id="sound-icon">volume_up</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Game Arena -->
    <main class="max-w-4xl w-full mx-auto px-4 py-3 sm:py-5 flex-1 flex flex-col justify-center items-center">
        
        <!-- Status Bar -->
        <div class="w-full max-w-md flex items-center justify-between p-3 rounded-2xl bg-white border border-slate-200 mb-3 shadow-md">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-xl bg-indigo-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">X</div>
                <span class="font-extrabold text-xs text-indigo-900" id="p1-label">Player 1</span>
            </div>

            <div class="px-3 py-1 rounded-full text-xs font-bold bg-indigo-50 text-indigo-800 border border-indigo-200" id="turn-banner">
                X's Turn • Any Board
            </div>

            <div class="flex items-center gap-2 text-right">
                <span class="font-extrabold text-xs text-rose-900" id="p2-label">Cyber Bot</span>
                <div class="w-7 h-7 rounded-xl bg-rose-600 text-white flex items-center justify-center font-bold text-xs shadow-sm">O</div>
            </div>
        </div>

        <!-- Master 9x9 Ultimate Board -->
        <div class="p-2 sm:p-3 bg-slate-900 rounded-3xl border-4 border-slate-700 shadow-2xl">
            <div id="master-board" class="grid grid-cols-3 gap-2 sm:gap-3">
                <!-- 9 sub-boards injected dynamically -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full py-3 text-center text-xs text-slate-500 border-t border-slate-200">
        Gyan Games Studio • Ultimate Tic-Tac-Toe • 81-Cell Multi-Quadrant Mind Game
    </footer>

    <!-- Multiplayer Modal -->
    <div id="multiplayer-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-md w-full overflow-hidden shadow-2xl p-5 space-y-4">
            <div class="flex items-center justify-between border-b pb-3">
                <h3 class="font-extrabold text-base text-slate-900">Online Ultimate Tic-Tac-Toe</h3>
                <button id="btn-close-multiplayer" class="p-1 rounded-full text-slate-400 hover:bg-slate-100">
                    <span class="material-symbols-rounded">close</span>
                </button>
            </div>

            <div class="flex rounded-full bg-slate-100 p-1 text-xs font-bold">
                <button id="tab-host" class="flex-1 py-1.5 rounded-full bg-indigo-600 text-white transition-all">Host Room</button>
                <button id="tab-join" class="flex-1 py-1.5 rounded-full text-slate-500 transition-all">Join Room</button>
            </div>

            <div id="view-host" class="space-y-4">
                <div id="host-setup" class="space-y-3">
                    <input type="text" id="host-name" value="Player 1" maxlength="12" class="w-full px-3 py-2 rounded-xl border text-xs font-bold focus:outline-none">
                    <button id="btn-create-room" class="w-full py-2.5 rounded-full bg-indigo-600 text-white text-xs font-bold shadow-md">Create Room</button>
                </div>
                <div id="host-active" class="hidden space-y-3 text-center">
                    <div class="p-3 bg-indigo-50 rounded-2xl border border-indigo-200">
                        <span class="text-[10px] uppercase font-bold text-indigo-800 block">Room Code</span>
                        <span id="display-room-code" class="text-2xl font-mono font-extrabold text-slate-900">----</span>
                    </div>
                    <div id="qrcode-box" class="flex justify-center p-2 bg-white rounded-2xl border mx-auto w-32 h-32 items-center"></div>
                    <div class="flex gap-2">
                        <button id="btn-copy-code" class="flex-1 py-2 rounded-xl bg-slate-100 text-xs font-bold">Copy Code</button>
                        <button id="btn-copy-link" class="flex-1 py-2 rounded-xl bg-indigo-600 text-white text-xs font-bold">Copy Link</button>
                    </div>
                </div>
            </div>

            <div id="view-join" class="hidden space-y-3">
                <input type="text" id="join-name" value="Challenger" maxlength="12" placeholder="Your Name" class="w-full px-3 py-2 rounded-xl border text-xs font-bold focus:outline-none">
                <input type="text" id="join-code" placeholder="UTTT-XXXX" maxlength="10" class="w-full px-3 py-2 rounded-xl border text-xs font-mono font-extrabold text-center uppercase focus:outline-none">
                <button id="btn-submit-join" class="w-full py-2.5 rounded-full bg-indigo-600 text-white text-xs font-bold shadow-md">Join Match</button>
            </div>
        </div>
    </div>

    <!-- Victory Modal -->
    <div id="victory-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center space-y-4 shadow-2xl border-2 border-indigo-400">
            <div class="w-16 h-16 rounded-full bg-indigo-50 text-indigo-600 mx-auto flex items-center justify-center text-3xl font-extrabold">
                🏆
            </div>
            <div>
                <h3 class="text-lg font-extrabold text-slate-900" id="winner-title">Player 1 Wins!</h3>
                <p class="text-xs text-slate-500 mt-1">Conquered the Master Board!</p>
            </div>
            <button id="btn-victory-restart" class="w-full py-2.5 rounded-full bg-indigo-600 text-white text-xs font-bold shadow-md">Play Again</button>
        </div>
    </div>

    <script>
        const SITE_URL = 'https://gyan-games.vercel.app';

        class SoundEngine {
            constructor() { this.ctx = null; this.enabled = true; }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            playTone(freq, type = 'sine', duration = 0.08, gain = 0.2) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator();
                const g = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                g.gain.setValueAtTime(gain, this.ctx.currentTime);
                g.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
                osc.connect(g);
                g.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + duration);
            }
            playMove() { this.playTone(480, 'triangle', 0.06, 0.2); }
            playSubWin() {
                this.playTone(523, 'triangle', 0.1, 0.25);
                setTimeout(() => this.playTone(659, 'triangle', 0.12, 0.25), 90);
                setTimeout(() => this.playTone(784, 'triangle', 0.18, 0.25), 180);
            }
            playGameWin() {
                this.playTone(523, 'triangle', 0.12, 0.25);
                setTimeout(() => this.playTone(659, 'triangle', 0.14, 0.25), 100);
                setTimeout(() => this.playTone(784, 'triangle', 0.16, 0.25), 200);
                setTimeout(() => this.playTone(1046, 'triangle', 0.3, 0.3), 300);
            }
        }
        const sfx = new SoundEngine();

        // 9 sub-boards (0-8), each has 9 cells (0-8)
        let subBoards = Array.from({ length: 9 }, () => Array(9).fill(null));
        let masterStatus = Array(9).fill(null); // 'X', 'O', 'TIE', or null
        let activeBoardIdx = -1; // -1 means player can play in ANY available board!
        let currentPlayer = 'X'; // 'X' (Indigo) or 'O' (Rose)
        let isGameOver = false;

        let netMode = 'local';
        let localPlayerSymbol = 'X';
        let p1Name = 'Player 1';
        let p2Name = 'Cyber Bot';

        class UTTTNetworkManager {
            constructor() {
                this.peer = null;
                this.conn = null;
                this.isHost = false;
                this.roomCode = null;
                this.isConnected = false;
            }
            generateCode() {
                const chars = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ';
                let c = 'UTTT-';
                for (let i = 0; i < 4; i++) c += chars.charAt(Math.floor(Math.random() * chars.length));
                return c;
            }
            initHost(name) {
                this.isHost = true;
                this.roomCode = this.generateCode();
                p1Name = name;
                netMode = 'online';
                localPlayerSymbol = 'X';

                const peerId = `uttt-room-${this.roomCode.toLowerCase()}`;
                if (this.peer) this.peer.destroy();
                this.peer = new Peer(peerId, { debug: 1 });

                this.peer.on('open', () => {
                    this.isConnected = true;
                    document.getElementById('display-room-code').textContent = this.roomCode;
                    renderQRCode(this.roomCode);
                    document.getElementById('host-setup').classList.add('hidden');
                    document.getElementById('host-active').classList.remove('hidden');
                    updateHeaderNetUI(true, this.roomCode);
                });
                this.peer.on('connection', (c) => {
                    this.conn = c;
                    this.setupConnection();
                });
            }
            initClient(code, name) {
                this.isHost = false;
                this.roomCode = code.toUpperCase();
                p2Name = name;
                netMode = 'online';
                localPlayerSymbol = 'O';

                const targetId = `uttt-room-${this.roomCode.toLowerCase()}`;
                if (this.peer) this.peer.destroy();
                this.peer = new Peer(null, { debug: 1 });

                this.peer.on('open', () => {
                    const c = this.peer.connect(targetId, { reliable: true });
                    this.conn = c;
                    this.setupConnection();
                });
            }
            setupConnection() {
                this.conn.on('open', () => {
                    this.isConnected = true;
                    updateHeaderNetUI(this.isHost, this.roomCode);
                    if (this.isHost) {
                        this.conn.send({ type: 'welcome', hostName: p1Name });
                    } else {
                        this.conn.send({ type: 'join_info', clientName: p2Name });
                        document.getElementById('multiplayer-modal').classList.add('hidden');
                    }
                });
                this.conn.on('data', (d) => {
                    if (d.type === 'welcome') {
                        p1Name = d.hostName;
                        document.getElementById('multiplayer-modal').classList.add('hidden');
                        updateNames();
                    } else if (d.type === 'join_info') {
                        p2Name = d.clientName;
                        updateNames();
                    } else if (d.type === 'move') {
                        makeMove(d.boardIdx, d.cellIdx, false);
                    } else if (d.type === 'restart') {
                        initGame();
                    }
                });
            }
            send(d) { if (this.conn && this.conn.open) this.conn.send(d); }
        }
        const net = new UTTTNetworkManager();

        function getRoomShareUrl(code) { return `${SITE_URL}/ultimate-ttt.html?room=${encodeURIComponent(code)}`; }

        function renderQRCode(code) {
            const box = document.getElementById('qrcode-box');
            box.innerHTML = '';
            if (typeof QRCode !== 'undefined') {
                new QRCode(box, { text: getRoomShareUrl(code), width: 110, height: 110 });
            }
        }

        function updateHeaderNetUI(isOnline, code) {
            const netLabel = document.getElementById('net-label');
            const netDot = document.getElementById('net-dot');
            const hudCode = document.getElementById('hud-room-code');
            if (isOnline && code) {
                netLabel.textContent = net.isHost ? 'Online (Host)' : 'Online (Peer)';
                netDot.className = 'w-2 h-2 rounded-full bg-indigo-500';
                hudCode.textContent = `ROOM: ${code}`;
                hudCode.classList.remove('hidden');
            } else {
                netLabel.textContent = 'Solo / Bot';
                netDot.className = 'w-2 h-2 rounded-full bg-slate-400';
                hudCode.classList.add('hidden');
            }
            updateNames();
        }

        function updateNames() {
            document.getElementById('p1-label').textContent = p1Name;
            document.getElementById('p2-label').textContent = p2Name;
            updateTurnBanner();
        }

        function initGame() {
            subBoards = Array.from({ length: 9 }, () => Array(9).fill(null));
            masterStatus = Array(9).fill(null);
            activeBoardIdx = -1;
            currentPlayer = 'X';
            isGameOver = false;
            document.getElementById('victory-modal').classList.add('hidden');
            renderMasterBoardUI();
            updateTurnBanner();
        }

        function renderMasterBoardUI() {
            const master = document.getElementById('master-board');
            master.innerHTML = '';

            for (let b = 0; b < 9; b++) {
                const subBoardEl = document.createElement('div');
                subBoardEl.id = `sub-board-${b}`;
                subBoardEl.className = 'relative bg-white rounded-2xl p-1.5 shadow-sm border border-slate-300 transition-all';

                const miniGrid = document.createElement('div');
                miniGrid.className = 'grid grid-cols-3 gap-1';

                for (let c = 0; c < 9; c++) {
                    const cell = document.createElement('div');
                    cell.id = `cell-${b}-${c}`;
                    cell.className = 'w-8 h-8 sm:w-10 sm:h-10 rounded-lg bg-slate-100 flex items-center justify-center font-extrabold text-sm sm:text-base cursor-pointer cell-hover transition-all';
                    cell.addEventListener('click', () => handleCellClick(b, c));
                    miniGrid.appendChild(cell);
                }

                subBoardEl.appendChild(miniGrid);

                // Overlay for conquered sub-board
                const overlay = document.createElement('div');
                overlay.id = `overlay-${b}`;
                overlay.className = 'absolute inset-0 rounded-2xl hidden items-center justify-center font-extrabold text-4xl sm:text-5xl backdrop-blur-xs sub-board-conquered';
                subBoardEl.appendChild(overlay);

                master.appendChild(subBoardEl);
            }
            highlightActiveBoards();
        }

        function highlightActiveBoards() {
            for (let b = 0; b < 9; b++) {
                const el = document.getElementById(`sub-board-${b}`);
                el.classList.remove('active-board');
                if (!isGameOver) {
                    if (activeBoardIdx === -1 && masterStatus[b] === null) {
                        el.classList.add('active-board');
                    } else if (activeBoardIdx === b && masterStatus[b] === null) {
                        el.classList.add('active-board');
                    }
                }
            }
        }

        function handleCellClick(boardIdx, cellIdx) {
            if (isGameOver) return;
            if (netMode === 'online' && currentPlayer !== localPlayerSymbol) return;

            // Check if board is active
            if (activeBoardIdx !== -1 && activeBoardIdx !== boardIdx) return;
            if (masterStatus[boardIdx] !== null) return;
            if (subBoards[boardIdx][cellIdx] !== null) return;

            if (netMode === 'online') {
                net.send({ type: 'move', boardIdx, cellIdx });
            }
            makeMove(boardIdx, cellIdx, true);
        }

        function makeMove(boardIdx, cellIdx, isLocal) {
            sfx.playMove();

            subBoards[boardIdx][cellIdx] = currentPlayer;
            const cellEl = document.getElementById(`cell-${boardIdx}-${cellIdx}`);
            cellEl.classList.add('cell-taken');
            cellEl.textContent = currentPlayer;
            cellEl.style.color = currentPlayer === 'X' ? '#4F46E5' : '#E11D48';

            // Check if this sub-board is won
            const subWin = check3InARow(subBoards[boardIdx]);
            if (subWin) {
                masterStatus[boardIdx] = subWin;
                claimSubBoardUI(boardIdx, subWin);
                sfx.playSubWin();

                // Check if master board is won
                const masterWin = check3InARow(masterStatus);
                if (masterWin) {
                    isGameOver = true;
                    sfx.playGameWin();
                    const winnerName = masterWin === 'X' ? p1Name : p2Name;
                    document.getElementById('winner-title').textContent = `🏆 ${winnerName} Wins!`;
                    document.getElementById('victory-modal').classList.remove('hidden');
                    if (typeof confetti !== 'undefined') confetti({ particleCount: 170, spread: 85, origin: { y: 0.6 } });
                    return;
                }
            } else if (subBoards[boardIdx].every(c => c !== null)) {
                masterStatus[boardIdx] = 'TIE';
                claimSubBoardUI(boardIdx, 'TIE');
            }

            // Determine next active board: destination is cellIdx
            if (masterStatus[cellIdx] !== null) {
                activeBoardIdx = -1; // FREE MOVE!
            } else {
                activeBoardIdx = cellIdx;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateTurnBanner();
            highlightActiveBoards();

            checkBotTurn();
        }

        function claimSubBoardUI(b, winner) {
            const overlay = document.getElementById(`overlay-${b}`);
            overlay.classList.remove('hidden');
            overlay.classList.add('flex');
            if (winner === 'X') {
                overlay.textContent = 'X';
                overlay.style.backgroundColor = 'rgba(238, 242, 255, 0.88)';
                overlay.style.color = '#4F46E5';
            } else if (winner === 'O') {
                overlay.textContent = 'O';
                overlay.style.backgroundColor = 'rgba(255, 241, 242, 0.88)';
                overlay.style.color = '#E11D48';
            } else {
                overlay.textContent = '-';
                overlay.style.backgroundColor = 'rgba(241, 245, 249, 0.88)';
                overlay.style.color = '#64748B';
            }
        }

        function check3InARow(arr) {
            const lines = [
                [0, 1, 2], [3, 4, 5], [6, 7, 8],
                [0, 3, 6], [1, 4, 7], [2, 5, 8],
                [0, 4, 8], [2, 4, 6]
            ];
            for (let [x, y, z] of lines) {
                if (arr[x] && arr[x] !== 'TIE' && arr[x] === arr[y] && arr[x] === arr[z]) {
                    return arr[x];
                }
            }
            return null;
        }

        function updateTurnBanner() {
            const banner = document.getElementById('turn-banner');
            const isX = currentPlayer === 'X';
            const name = isX ? p1Name : p2Name;
            banner.className = `px-3 py-1 rounded-full text-xs font-bold ${isX ? 'bg-indigo-50 text-indigo-800 border border-indigo-200' : 'bg-rose-50 text-rose-800 border border-rose-200'}`;
            const targetBoardText = activeBoardIdx === -1 ? 'Any Board (Free Move)' : `Board #${activeBoardIdx + 1}`;
            banner.textContent = `${name}'s Turn (${currentPlayer}) • ${targetBoardText}`;
        }

        function checkBotTurn() {
            if (!isGameOver && netMode === 'local' && currentPlayer === 'O' && p2Name === 'Cyber Bot') {
                setTimeout(botMakeMove, 500);
            }
        }

        function botMakeMove() {
            // Find valid boards
            let validBoards = [];
            if (activeBoardIdx !== -1 && masterStatus[activeBoardIdx] === null) {
                validBoards.push(activeBoardIdx);
            } else {
                for (let b = 0; b < 9; b++) {
                    if (masterStatus[b] === null) validBoards.push(b);
                }
            }
            if (validBoards.length === 0) return;

            // Pick a board
            const b = validBoards[Math.floor(Math.random() * validBoards.length)];
            // Find empty cells in that board
            const emptyCells = [];
            for (let c = 0; c < 9; c++) {
                if (subBoards[b][c] === null) emptyCells.push(c);
            }
            if (emptyCells.length > 0) {
                const cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                makeMove(b, cell, false);
            }
        }

        document.getElementById('btn-restart').addEventListener('click', () => {
            initGame();
            if (netMode === 'online') net.send({ type: 'restart' });
        });
        document.getElementById('btn-victory-restart').addEventListener('click', () => {
            initGame();
            if (netMode === 'online') net.send({ type: 'restart' });
        });
        document.getElementById('btn-toggle-sound').addEventListener('click', () => {
            sfx.enabled = !sfx.enabled;
            document.getElementById('sound-icon').textContent = sfx.enabled ? 'volume_up' : 'volume_off';
        });

        // Online Modal
        document.getElementById('btn-open-multiplayer').addEventListener('click', () => {
            document.getElementById('multiplayer-modal').classList.remove('hidden');
            document.getElementById('multiplayer-modal').classList.add('flex');
        });
        document.getElementById('btn-close-multiplayer').addEventListener('click', () => {
            document.getElementById('multiplayer-modal').classList.add('hidden');
            document.getElementById('multiplayer-modal').classList.remove('flex');
        });
        document.getElementById('tab-host').addEventListener('click', () => {
            document.getElementById('tab-host').className = 'flex-1 py-1.5 rounded-full bg-indigo-600 text-white transition-all';
            document.getElementById('tab-join').className = 'flex-1 py-1.5 rounded-full text-slate-500 transition-all';
            document.getElementById('view-host').classList.remove('hidden');
            document.getElementById('view-join').classList.add('hidden');
        });
        document.getElementById('tab-join').addEventListener('click', () => {
            document.getElementById('tab-join').className = 'flex-1 py-1.5 rounded-full bg-indigo-600 text-white transition-all';
            document.getElementById('tab-host').className = 'flex-1 py-1.5 rounded-full text-slate-500 transition-all';
            document.getElementById('view-join').classList.remove('hidden');
            document.getElementById('view-host').classList.add('hidden');
        });
        document.getElementById('btn-create-room').addEventListener('click', () => {
            const name = document.getElementById('host-name').value.trim() || 'Player 1';
            net.initHost(name);
        });
        document.getElementById('btn-submit-join').addEventListener('click', () => {
            const code = document.getElementById('join-code').value.trim().toUpperCase();
            const name = document.getElementById('join-name').value.trim() || 'Challenger';
            if (code) net.initClient(code, name);
        });
        document.getElementById('btn-copy-code').addEventListener('click', () => {
            if (net.roomCode) navigator.clipboard.writeText(net.roomCode);
        });
        document.getElementById('btn-copy-link').addEventListener('click', () => {
            if (net.roomCode) navigator.clipboard.writeText(getRoomShareUrl(net.roomCode));
        });

        window.onload = function() {
            initGame();
            const urlParams = new URLSearchParams(window.location.search);
            const room = urlParams.get('room');
            if (room) {
                document.getElementById('join-code').value = room;
                document.getElementById('multiplayer-modal').classList.remove('hidden');
                document.getElementById('multiplayer-modal').classList.add('flex');
                document.getElementById('tab-join').click();
            }
        };
    </script>
</body>
</html>
